# Tema visual de SmartNose (colores de la presentación del Grupo 15).
# Streamlit lee este archivo automáticamente si lanzas la app desde la raíz:
#     streamlit run app/Home.py

[theme]
base = "dark"
primaryColor = "#4FC9F0"              # cian SmartNose (acento principal)
backgroundColor = "#0B0D13"           # fondo casi negro de las diapositivas
secondaryBackgroundColor = "#161B27"  # tarjetas, barra lateral y widgets
textColor = "#EFEBE3"                 # blanco cálido de los títulos
borderColor = "#262C3A"
linkColor = "#4FC9F0"
font = "DM Sans:https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&display=swap"
baseRadius = "10px"
showWidgetBorder = true
# Colores de los gráficos nativos de Streamlit (mismo orden que los gases)
chartCategoricalColors = ["#FF6FA8", "#B58CFF", "#4FC9F0", "#FF8A4C", "#B6F06A", "#FFD45C"]

[theme.sidebar]
backgroundColor = "#10141E"
secondaryBackgroundColor = "#161B27"

[client]
toolbarMode = "minimal"
